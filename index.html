<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IdleOn Cooking Planner</title>
<meta name="description" content="Plan Legends of Idleon cooking: which meal to level next, how to discover new recipes (spices, kitchen, fire level, time) and what to spend meals on.">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#f7f8fb; --ink:#1b1f33; --muted:#666c86; --line:#dcdfea;
  --gold:#b98200; --gold-bg:#fff1c7; --ok:#1f8a55; --ok-bg:#d9f2e4; --bad:#c4391a; --bad-bg:#fde0d6;
  --blue:#2f63c8; --blue-bg:#dfe8fb; --slot:#2b3140; --slot2:#363d4f; --slot-line:#4a5266;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --ok:#5fd394; --ok-bg:#143326; --bad:#ff8a6b; --bad-bg:#3d1c14;
  --blue:#8fb2ff; --blue-bg:#1b2648; --slot:#1d2233; --slot2:#262c40; --slot-line:#353d58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1020; --panel:#151a30; --panel2:#11162a; --ink:#e6e8f4; --muted:#9097b3; --line:#262c48;
  --gold:#ffcb45; --gold-bg:#3b3112; --ok:#5fd394; --ok-bg:#143326; --bad:#ff8a6b; --bad-bg:#3d1c14;
  --blue:#8fb2ff; --blue-bg:#1b2648; --slot:#1d2233; --slot2:#262c40; --slot-line:#353d58; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;letter-spacing:.02em}
h3.sub{font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--muted);border-radius:0;padding:4px 10px;font:600 12px var(--mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;min-width:0;align-content:start}
.card-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.card-head h2{margin-right:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#nick,input.num,select{font:500 14px var(--mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:100%}
#nick{width:220px}
input.num{width:96px;padding:4px 6px;text-align:right}
select{font-family:var(--body);padding:5px 8px}
.hint{font-size:12.5px;color:var(--muted);flex:1 1 260px;min-width:0;margin:0}
.hint a,.foot a,.note a{color:inherit}
.or{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
textarea{width:100%;height:56px;resize:vertical;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
button,.file{font:500 13px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.ghost,.file{background:transparent;color:var(--ink);border:1px solid var(--line)}
.file{position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}
button:focus-visible,.file:focus-within,textarea:focus-visible,input:focus-visible,select:focus-visible,label.chk:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:13px;color:var(--muted)} .msg.err{color:var(--bad)}
label.chk{font-size:13px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline}
.stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12.5px;margin-left:4px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note b{color:var(--ink)}
.tabsbar{display:flex;flex-wrap:wrap;gap:6px}
.tabsbar button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font:600 13px var(--body)}
.tabsbar button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* game sprites: integer scale only, pixelated */
.sp{display:inline-block;flex:none;vertical-align:middle;background-repeat:no-repeat;image-rendering:pixelated;
  width:calc(var(--w) * var(--k) * 1px);height:calc(var(--h) * var(--k) * 1px);
  background-size:calc(var(--cols) * var(--w) * var(--k) * 1px) auto;
  background-position:calc(var(--x) * var(--w) * var(--k) * -1px) calc(var(--y) * var(--h) * var(--k) * -1px)}
.sp.meal{background-image:url(img/meals.png)} .sp.spice{background-image:url(img/spices.png)}
.sp.ribbon{background-image:url(img/ribbons.png)} .sp.fire{background-image:url(img/fire.png)}
.ladle{width:72px;height:72px;margin:-18px -12px;image-rendering:pixelated;vertical-align:middle}
.dim{opacity:.4;filter:grayscale(.7)}

/* spices strip */
.spices{display:flex;flex-wrap:wrap;gap:4px}
.spi{display:inline-flex;align-items:center;gap:2px;padding:1px 8px 1px 1px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;font:600 12px var(--mono)}
.spi.locked{opacity:.45;border-style:dashed}

/* kitchens */
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.kit{background:var(--slot);color:#e6e8f4;border:1px solid var(--slot-line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;min-width:0}
.kit.rich{border-color:#ffcb45;box-shadow:inset 0 0 0 1px #ffcb45}
.kit.locked{opacity:.55;border-style:dashed}
.kit .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.kit .hd b{font-family:var(--display);font-size:15px}
.kit .st{font-size:12px;color:#aab2c8;display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:34px}
.kit .ups{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 8px;align-items:center;font:500 12px var(--mono)}
.kit .ups .c{color:#aab2c8;text-align:right;white-space:nowrap}
.kit .ups .c.no{color:#ff8a6b}
.kit .ups .c.yes{color:#7ee0a8}
.kit .rates{display:flex;flex-wrap:wrap;gap:2px 12px;font:600 12px var(--mono);color:#ffcb45}
.kit .rates span{color:#aab2c8;font-weight:400}
.tag{font:600 10.5px var(--mono);padding:0 5px;border-radius:3px;background:#ffcb45;color:#1b1f33}

/* tables */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1}
th.l,td.l{text-align:left}
td.nm{white-space:normal;min-width:190px}
.nmw{display:flex;gap:8px;align-items:center}
.nmw small{display:block;color:var(--muted);font-size:11.5px}
td.num{font-family:var(--mono);font-size:13px}
td.wrap{white-space:normal;min-width:180px}
tr.locked td{opacity:.5}
tr.best td{background:var(--gold-bg)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;font-family:var(--mono)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--blue-bg);color:var(--blue)} .chip.gold{background:var(--gold-bg);color:var(--gold)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.part i{background:var(--gold)}
.combo{display:inline-flex;gap:2px;align-items:center;background:var(--slot);border-radius:5px;padding:2px 4px}
.plates{display:inline-flex;gap:3px;align-items:flex-end}
.plates .pm{display:inline-flex;flex-direction:column;align-items:center;border-radius:4px;padding:1px}
.plates .pm.known>span{opacity:.35;filter:grayscale(.8)}
.plates .pm.tgt{box-shadow:inset 0 0 0 2px var(--gold);background:var(--gold-bg)}
.plates .pm i{font:600 9.5px var(--mono);font-style:normal;color:var(--muted)}

/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.setbox{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:6px;align-content:start}
.setbox label{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.setbox .note{font-size:12px}
table.brk td{padding:2px 6px;font-size:12.5px;white-space:normal}
table.brk td.v{white-space:nowrap}
table.brk td.v{font-family:var(--mono);font-weight:600}
table.brk tr.one td{opacity:.45}
table.brk tr.tot td{border-top:2px solid var(--ink);font-weight:700}
table.brk td.d{color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* plan */
ol.plan{margin:0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:st}
ol.plan li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:3px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;counter-increment:st}
ol.plan li::before{content:counter(st);font:600 12px var(--mono);color:var(--muted)}
ol.plan li.spd{border-color:var(--blue)}
ol.plan .w{min-width:0}
ol.plan .w small{display:block;color:var(--muted);font-size:11.5px}
ol.plan .t{font:600 12.5px var(--mono);text-align:right}
ol.plan .t small{display:block;color:var(--muted);font-weight:400}
.tips{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.tips b{font-family:var(--mono);font-weight:600}

#tip{position:fixed;z-index:20;width:340px;max-width:calc(100vw - 16px);background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.4;pointer-events:none;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
#tip .hd{display:flex;gap:8px;align-items:center;margin-bottom:4px}
#tip .hd b{font-family:var(--display);font-size:14px;line-height:1.2}
#tip .t{opacity:.75;font-size:11.5px}
.foot{font-size:12.5px;color:var(--muted);max-width:90ch;margin:0}
@media (max-width:560px){ol.plan li{grid-template-columns:22px auto minmax(0,1fr)}ol.plan .t{grid-column:2/4;text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-i="title"></span> <small data-i="subtitle"></small></h1>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
    </div>
  </header>

  <div class="card">
    <form class="row" id="nickForm">
      <input id="nick" type="text" autocomplete="username" spellcheck="false" aria-labelledby="nickBtn">
      <button id="nickBtn" type="submit" data-i="nick_btn"></button>
      <span class="hint" data-i="nick_hint"></span>
    </form>
    <div class="or" data-i="or"></div>
    <textarea id="save" spellcheck="false" aria-label="Save JSON"></textarea>
    <div class="row">
      <button id="go" type="button" data-i="parse"></button>
      <label class="file"><span data-i="open"></span><input id="file" type="file" accept=".json,.txt,application/json,text/plain"></label>
      <button id="forget" type="button" class="ghost" data-i="forget"></button>
      <label class="chk"><input type="checkbox" id="showLocked"><span data-i="show_locked"></span></label>
      <span id="msg" class="msg" role="status"></span>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <section class="card" aria-labelledby="h-set">
    <div class="card-head">
      <h2 id="h-set" data-i="settings"></h2>
      <label><span data-i="s_char"></span> <select id="charSel"></select></label>
      <label><span data-i="k"></span> <select id="brkK"></select></label>
      <label class="chk"><input type="checkbox" id="labOn" checked><span data-i="s_lab"></span></label>
      <label class="chk"><input type="checkbox" id="useRecipeKitchens"><span data-i="s_rk"></span></label>
    </div>
    <div class="set">
      <div class="setbox"><h3 class="sub" data-i="b_speed"></h3><div class="tablebox"><table class="brk" id="brkSpd"></table></div></div>
      <div class="setbox"><h3 class="sub" data-i="b_fire"></h3><div class="tablebox"><table class="brk" id="brkFire"></table></div>
        <h3 class="sub" data-i="b_other"></h3><div class="tablebox"><table class="brk" id="brkOther"></table></div></div>
    </div>
    <p class="note" id="setNote"></p>
  </section>

  <section class="card" aria-labelledby="h-kit">
    <div class="card-head"><h2 id="h-kit" data-i="kitchens"></h2></div>
    <div class="spices" id="spices"></div>
    <div class="kits" id="kits"></div>
  </section>

  <section class="card" aria-labelledby="h-plan">
    <div class="card-head">
      <h2 id="h-plan" data-i="plan"></h2>
      <label><span data-i="goal"></span> <select id="goal"></select></label>
      <label><span data-i="steps"></span> <input id="steps" class="num" type="number" min="1" max="200" step="1" value="15"></label>
      <label class="chk"><input type="checkbox" id="mixSpeed" checked><span data-i="mix_speed"></span></label>
      <label class="chk"><input type="checkbox" id="planNow"><span data-i="plan_now"></span></label>
      <label><span data-i="plan_view"></span> <select id="planView"><option value="meal" data-i="pv_meal"></option><option value="step" data-i="pv_step"></option></select></label>
    </div>
    <p class="note" id="planNote"></p>
    <ol class="plan" id="planList"></ol>
  </section>

  <section class="card" aria-labelledby="h-meals">
    <div class="card-head">
      <h2 id="h-meals" data-i="meals"></h2>
      <label><span data-i="filter"></span> <select id="cat"></select></label>
    </div>
    <div class="tablebox"><table id="mealTbl"></table></div>
    <p class="note" data-i="meals_note"></p>
  </section>

  <section class="card" aria-labelledby="h-disc">
    <div class="card-head">
      <h2 id="h-disc" data-i="disc"></h2>
      <label><span data-i="disc_k"></span> <select id="discK"></select></label>
    </div>
    <div id="discNow"></div>
    <h3 class="sub" data-i="disc_targets"></h3>
    <div class="tablebox"><table id="discTbl"></table></div>
    <h3 class="sub" data-i="disc_any"></h3>
    <div class="tablebox"><table id="anyTbl"></table></div>
    <p class="note" data-i="disc_note"></p>
  </section>

  <section class="card" aria-labelledby="h-adv">
    <div class="card-head"><h2 id="h-adv" data-i="advice"></h2></div>
    <ul class="tips" id="tips"></ul>
    <h3 class="sub" data-i="jewels"></h3>
    <div class="tablebox"><table id="jewTbl"></table></div>
    <h3 class="sub" data-i="chips"></h3>
    <div class="tablebox"><table id="chipTbl"></table></div>
  </section>

  <p class="foot" data-i="foot"></p>
</div>
<div id="tip" hidden></div>
<script>

  const out = [];
  sp.forEach(s => { if (s >= 0 && !out.includes(D.single[s])) out.push(D.single[s]); });
  let sum = 0, cnt = 0; sp.forEach(s => { if (s >= 0) { sum += s; cnt++; } });
  sum = sum < 71 ? Math.min(55, sum) : sum < 87 ? Math.min(65, Math.round(sum - 14)) : Math.round(sum - 22);
  if (sum > .5) {
    const n = Math.min(cnt, 3);
    for (let i = 0; i < n; i++) {
      const m = Math.round(Math.min(73, Math.max(0, sum + (i - Math.floor((n - 1) / 2)))));
      if (!out.includes(m) && !SINGLE.has(m) && m < 74) out.push(m);
    }
  }
  return out.sort((a, b) => a - b);
}
const fireReq = list => { const last = list[list.length - 1]; return 2 * D.meals[Math.min(66, last)].req * Math.pow(25, Math.max(0, last - 66)); };

function roll(list, luck, lv, isKnown){
  const res = { any: 0, per: {} };
  let reach = 1;
  for (let j = list.length - 1; j >= 0; j--) {
    const m = list[j], kn = isKnown(m), o = Math.min(1, (D.odds[j] || 0) * (kn ? 1 : luck * Math.pow(1.5, lv)));
    const hit = reach * o;
    if (!kn) { res.any += hit; res.per[m] = hit; }
    reach *= 1 - o;
  }
  return res;
}
function bestLevel(list, fire, luck, target){   // fire level with the lowest expected time per success
  const req = fireReq(list); let best = null;
  for (let lv = 1; lv <= 40; lv++) {
    const r = roll(list, luck, lv, known), p = target == null ? r.any : (r.per[target] || 0);
    if (p <= 0) return null;
    const t = req * Math.pow(3, lv - 1) / fire, e = t / p;
    if (!best || e < best.e) best = { lv, p, t, e }; else if (p >= .9999) break;

}
function* combos(spices){
  const n = spices.length;
  for (let a = 0; a < n; a++) { yield [spices[a]];
    for (let b = a + 1; b < n; b++) { yield [spices[a], spices[b]];
      for (let c = b + 1; c < n; c++) { yield [spices[a], spices[b], spices[c]];
        for (let d = c + 1; d < n; d++) yield [spices[a], spices[b], spices[c], spices[d]]; } } }
}
let discCache = null, acctVer = 0;
function discover(){
  const key = [acctVer, $("#discK").value, labOn, charSel(), lang].join("|");
  if (discCache && discCache.key === key) return discCache.v;
  const v = discover2(); discCache = { key, v }; return v;
}
function discover2(){
  const allSp = Array.from({ length: Math.min(28, D.single.length) }, (_, s) => s), own = allSp.filter(spiceOpen);   // spices without a RANDOlist[49] meal are not in the game yet
  const sel = $("#discK").value, ks = sel === "" ? [...Array(NK).keys()].filter(ownedKitchen) : [+sel];
  const kinfo = ks.map(k => ({ k, f: kFire(k), luck: kLuck(k) }));
  const targets = {}, any = [];
  // spices you don't own yet: only check combos that use them, on the strongest kitchen, to keep it fast
  const top = kinfo.slice().sort((a, b) => b.f * b.luck - a.f * a.luck).slice(0, 1);
  const run = (spList, tag) => {
    for (const c of combos(spList)) {
      if (tag === "all" && c.every(spiceOpen)) continue;
      const list = possible(c), news = list.filter(m => !known(m));
      if (!news.length) continue;
      for (const ki of tag === "all" ? top : kinfo) {
        if (tag === "own") { const b = bestLevel(list, ki.f, ki.luck, null); if (b) any.push({ c, list, k: ki.k, b }); }
        for (const m of news) {
          const cur = targets[m];
          if (cur && cur.tag === "own" && tag === "all") continue;
          const b = bestLevel(list, ki.f, ki.luck, m);
          if (b && (!cur || (cur.tag === "all" && tag === "own") || b.e < cur.b.e)) targets[m] = { c, list, k: ki.k, b, tag };
        }
      }
    }
  };
  run(own, "own");
  if (acct && own.length < allSp.length) run(allSp, "all");

  for (const x of any) { const key = x.c.join(","); if (seen.has(key)) continue; seen.add(key); anyTop.push(x); if (anyTop.length >= 8) break; }
  return { targets, anyTop };
}

function goals(){
  const cats = [];
  D.meals.forEach((m, i) => { if ((showLocked() || known(i)) && !SPEED_CATS.includes(m.cat) && !cats.includes(m.cat)) cats.push(m.cat); });
  return cats;
}
function plan(){
  const goal = $("#goal").value || "speed", now = $("#planNow").checked, mx = maxLv(), mix = $("#mixSpeed").checked;
  const steps = now ? 1000 : Math.max(1, Math.min(200, +$("#steps").value || 15));
  const lv = acct ? acct.lv.slice() : D.meals.map(() => 0), qty = acct ? acct.qty.slice() : D.meals.map(() => 0);
  const avail = i => acct ? known(i) : true;
  const out = []; let t = 0, first = true;
  const speedC = (S) => { const c = []; for (let i = 0; i < NM; i++) if (avail(i) && SPEED_CATS.includes(D.meals[i].cat) && lv[i] < mx) {
      const cost = costNext(i, lv[i], first), need = Math.max(0, cost - qty[i]), time = need * D.meals[i].req / S;
      const lv2 = lv.slice(); lv2[i]++; const q2 = qty.slice(); q2[i] = Math.max(0, q2[i] - cost);
      const g = totalSpeed(lv2, q2) / S; if (g > 1 && (!now || need <= 0)) c.push({ i, cost, need, time, g, v: Math.log(g) }); } return c; };
  for (let s = 0; s < steps; s++) {
    const S = totalSpeed(lv, qty); if (!(S > 0)) break;
    let pick = null;
    if (goal === "speed") {
      for (const c of speedC(S)) { c.score = c.v / (c.time + 1e-9); if (!pick || c.score > pick.score) pick = c; }
      if (pick) pick.spd = true;
    } else {
      for (let i = 0; i < NM; i++) if (avail(i) && D.meals[i].cat === goal && lv[i] < mx) {
        const cost = costNext(i, lv[i], first), need = Math.max(0, cost - qty[i]), time = need * D.meals[i].req / S;
        const v = mealBonus(i, lv[i] + 1) - mealBonus(i, lv[i]), score = v / (time + 1e-9);
        if (now && need > 0) continue;
        if (!pick || score > pick.score) pick = { i, cost, need, time, v, score };
      }
      if (now && mix) {   // with stock only, speed meals cost nothing that the goal needs
        let sp = null; for (const c of speedC(S)) if (!sp || c.v > sp.v) sp = c;
        if (sp && !pick) { pick = sp; pick.spd = true; }
      } else if (pick && mix) {   // a speed meal pays off if its cost is below the time it saves on the rest of the plan
        const rest = pick.time * (steps - s);
        let sp = null; for (const c of speedC(S)) if (c.time < rest * (1 - 1 / c.g) && (!sp || c.v / (c.time + 1e-9) > sp.v / (sp.time + 1e-9))) sp = c;

    qty[i] = Math.max(0, qty[i] + pick.need - pick.cost); lv[i]++; t += pick.time; first = false;
    out.push({ i, lv: lv[i], cost: pick.cost, need: pick.need, time: pick.time, t, spd: !!pick.spd, g: pick.g, v: pick.v, S: before });
  }
  return out;
}

      const list = possible(kt.sp), req = fireReq(list), flv = fireLvOf(kt.acc, req), r = roll(list, kLuck(k), flv, known), b = bestLevel(list, kFire(k), kLuck(k), null);
      return `<tr><td class="l">${L.k} ${k + 1}</td><td class="l">${comboHTML(kt.sp.filter(s => s >= 0))}</td><td class="l">${plates(list)}</td><td class="l">${spr("fire", Math.min(11, flv), 1)} ${L.fire_lv(flv)}</td>`
        + `<td class="l wrap">${list.every(known) ? `<span class="chip bad">${L.zero_new}</span>` : flv < 1 ? L.need_fire(dur((req - kt.acc) / kFire(k)), pct(roll(list, kLuck(k), 1, known).any)) : `<span class="chip ok">${L.claim_now(pct(r.any))}</span>`}${b ? "<br>" + L.best_at(dur(b.e)) : ""}</td></tr>`;
    }).join("") + `</tbody></table></div>` : `<p class="note">${L.disc_none}</p>`);
  }
  $("#discNow").innerHTML = now;
  const { targets, anyTop } = discover();
  const sl = showLocked();
  const rows = Object.keys(targets).map(Number).map(m => Object.assign({ m }, targets[m])).sort((a, b) => (a.tag === b.tag ? 0 : a.tag === "own" ? -1 : 1) || a.b.e - b.b.e);
  const hidden = rows.filter(r => r.tag === "all").length;
  const vis = rows.filter(r => r.tag === "own" || sl);
  const undisc = D.meals.map((_, i) => i).filter(i => !known(i));
  let h = `<thead><tr><th class="l">${L.th_meal}</th><th class="l">${L.th_combo}</th><th class="l">${L.th_poss}</th><th>${L.th_kit}</th><th>${L.th_chance}</th><th>${L.th_try}</th><th>${L.th_exp}</th></tr></thead><tbody>`;
  if (!undisc.length) h += `<tr><td class="l note" colspan="7">${L.disc_done}</td></tr>`;
  for (const r of vis) {
    h += `<tr class="${r.tag === "all" ? "locked" : ""}"><td class="l nm"><div class="nmw">${mealIc(r.m, 2)}<div>${esc(mName(r.m))}<small>${esc(mDesc(r.m, D.meals[r.m].base))}</small></div></div></td>`
      + `<td class="l">${comboHTML(r.c, true)}${r.tag === "all" ? `<br><span class="chip bad">${L.th_need}: ${r.c.filter(s => !spiceOpen(s)).map(s => s + 1).join(", ")}</span>` : ""}</td>`
      + `<td class="l">${plates(r.list, r.m)}</td><td class="num">${r.k + 1}</td>`
      + `<td class="num">${pct(r.b.p)}</td><td class="num">${dur(r.b.t)}</td><td class="num"><b>${dur(r.b.e)}</b></td></tr>`;
  }
  const unreachable = undisc.filter(m => !targets[m]).length;
  if (hidden && !sl) h += `<tr><td class="l note" colspan="7">${L.disc_more(hidden)}</td></tr>`;
  if (unreachable && !sl && !hidden && undisc.length && !vis.length) h += `<tr><td class="l note" colspan="7">${L.disc_more(unreachable)}</td></tr>`;
  $("#discTbl").innerHTML = h + "</tbody>";
  $("#anyTbl").innerHTML = `<thead><tr><th class="l">${L.th_combo}</th><th class="l">${L.th_poss}</th><th>${L.th_kit}</th><th>${L.th_chance}</th><th>${L.th_try}</th><th>${L.th_exp}</th></tr></thead><tbody>`
    + (anyTop.length ? anyTop.map((x, n) => `<tr class="${n ? "" : "best"}"><td class="l">${comboHTML(x.c)}</td><td class="l">${plates(x.list)}</td><td class="num">${x.k + 1}</td><td class="num">${pct(x.b.p)}</td><td class="num">${dur(x.b.t)}</td><td class="num"><b>${dur(x.b.e)}</b></td></tr>`).join("")
      : `<tr><td class="l note" colspan="6">${undisc.length ? L.disc_more(undisc.length) : L.disc_done}</td></tr>`) + "</tbody>";
}
function renderAdvice(){
  const tips = [], sl = showLocked();
  if (acct) {
    const idle = acct.kit.filter(k => k.st === 1).length; if (idle) tips.push(L.tip_idle(idle));
    if (acct.kit.some(kt => kt.st === 3 && possible(kt.sp).every(known))) tips.push(L.tip_zero);
    if (acct.art13 > 0) {
      const q = acct.qty[0], c = costNext(0, acct.lv[0], true);
      tips.push(L.tip_turkey({ tier: acct.art13, q: big(q), b: triag(q).toFixed(1), c: big(c), b2: triag(Math.max(0, q - c)).toFixed(1) }));
    } else tips.push(L.tip_turkey0);
    if (!acct.ach(224)) tips.push(L.tip_ach224);
    if (!acct.ach(225)) tips.push(L.tip_ach225);
    if (acct.ach(224) && acct.ach(225)) tips.push(L.tip_ach_ok);
    if (acct.lv.some(v => v > 0 && v < 11)) tips.push(L.tip_11);
    const res = reserves(), mx = maxLv(), free = [];
    for (let i = 0; i < NM; i++) if (known(i)) {
      const keep = (acct.lv[i] < mx ? costNext(i, acct.lv[i], true) : 0) + (res[i] || 0), f = acct.qty[i] - keep;
      if (f >= 1) free.push(`${esc(mName(i))} ${big(f)}`);
    }
    if (free.length) tips.push(L.tip_free(free.join("; ")));
    if (acct.ladles) tips.push(L.tip_ladle(big(acct.ladles)));
  }
  tips.push(L.tip_speedfirst);
  $("#tips").innerHTML = tips.map(t => `<li>${t}</li>`).join("");
  const row = (x, n, owned, extra) => {
    const haveM = acct ? acct.qty[x.meal] : 0, haveS = acct ? Math.max(0, acct.spice[x.spice]) : 0;
    const okM = haveM >= x.mq, okS = haveS >= x.sq;
    const st = owned ? `<span class="chip info">${L.st_bought}</span>` : !acct ? "" : okM && okS ? `<span class="chip ok">${L.st_ready}</span>`
      : `<span class="chip bad">${L.st_miss([!okM ? big(x.mq - haveM) + " " + esc(mName(x.meal)) : "", !okS ? big(x.sq - haveS) + " " + esc(sName(x.spice)) : ""].filter(Boolean).join(", "))}</span>`;
    return `<tr class="${acct && !known(x.meal) ? "locked" : ""}"><td class="l nm"><div class="nmw"><div><b>${esc((lang === "ru" && x.ru) || x.en)}</b><small>${esc((lang === "ru" && x.dru) || x.d)}</small></div></div></td>`
      + `<td class="num">${mealIc(x.meal, 1)} ${acct ? big(haveM) + " / " : ""}${big(x.mq)}</td><td class="num">${spiceIc(x.spice, 1)} ${acct ? big(haveS) + " / " : ""}${big(x.sq)}</td>${extra || ""}<td class="l">${st}</td></tr>`;
  };
  const vis = x => sl || !acct || (known(x.meal) && spiceOpen(x.spice));
  $("#jewTbl").innerHTML = `<thead><tr><th class="l">${L.th_item}</th><th>${L.th_meals}</th><th>${L.th_spice}</th><th class="l">${L.th_status}</th></tr></thead><tbody>`
    + D.jewels.map((j, n) => vis(j) ? row(j, n, acct && acct.jewel[n] === 1) : "").join("") + "</tbody>";
  $("#chipTbl").innerHTML = `<thead><tr><th class="l">${L.th_item}</th><th>${L.th_meals}</th><th>${L.th_spice}</th><th>${L.th_chip_have}</th><th class="l">${L.th_status}</th></tr></thead><tbody>`
    + D.chips.map((c, n) => vis(c) ? row(c, n, false, `<td class="num">${acct ? Math.max(0, acct.chip[n] || 0) : L.na}</td>`) : "").join("") + "</tbody>";
}
function renderAll(){
  renderStats(); renderSettings(); renderKitchens(); renderGoal(); renderPlan(); renderMeals(); renderDiscovery(); renderAdvice();
}

// ---------- tooltip ----------
const tip = $("#tip");
function tipHTML(el){
  if (el.dataset.meal != null) {
    const i = +el.dataset.meal, m = D.meals[i];
    return `<div class="hd">${spr("meal", i, 2)}<div><b>${esc(mName(i))}</b>${lang === "ru" && m.ru ? `<div class="t">${esc(m.en)}</div>` : ""}</div></div>`
      + `<div>${esc(mDesc(i, m.base))} / ${lang === "ru" ? "ур." : "lv"}</div><div class="t">req ${big(m.req)} · ${acct ? (known(i) ? `Lv ${acct.lv[i]}, ${big(acct.qty[i])}` : "🔒") : ""}</div>`;
  }
  const s = +el.dataset.spice;
  return `<div class="hd">${spr("spice", s, 2)}<div><b>${esc(sName(s))}</b></div></div>${acct ? `<div class="t">${spiceOpen(s) ? big(acct.spice[s]) : "🔒"}</div>` : ""}`
    + `<div class="t">→ ${esc(mName(D.single[s]))}</div>`;
}
function placeTip(x, y){
  const rc = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x + 14, innerWidth - rc.width - 8)) + "px";
  const below = y + 16, above = y - rc.height - 10;
  tip.style.top = Math.max(8, Math.min(below + rc.height <= innerHeight - 8 ? below : above, innerHeight - rc.height - 8)) + "px";
}
let tipFor = null;
document.addEventListener("mouseover", e => {
  const el = e.target.closest("[data-meal],[data-spice]");
  if (!el) { tip.hidden = true; tipFor = null; return; }
  if (tipFor !== el) { tipFor = el; tip.innerHTML = tipHTML(el); tip.hidden = false; }
  placeTip(e.clientX, e.clientY);
});
document.addEventListener("mousemove", e => { if (!tip.hidden) placeTip(e.clientX, e.clientY); });
addEventListener("scroll", () => { tip.hidden = true; tipFor = null; }, true);

// ---------- events ----------
$("#charSel").addEventListener("change", () => { charIdx = +$("#charSel").value; acct.calc = null; discCache = null; renderAll(); });
$("#brkK").addEventListener("change", renderSettings);
$("#labOn").addEventListener("change", () => { labOn = $("#labOn").checked; if (acct) acct.calc = null; discCache = null; renderAll(); });
for (const id of ["showLocked", "useRecipeKitchens", "mixSpeed"]) {
  const el = $("#" + id), v = store.get("ck-" + id); if (v != null) el.checked = v === "1";
  el.addEventListener("change", () => { store.set("ck-" + id, el.checked ? "1" : "0"); renderAll(); });
}
$("#goal").addEventListener("change", () => { store.set("ck-goal", $("#goal").value); renderPlan(); });
$("#steps").addEventListener("change", renderPlan);
for (const id of ["planNow", "planView"]) {
  const el = $("#" + id), v = store.get("ck-" + id);
  if (v != null) { if (el.type === "checkbox") el.checked = v === "1"; else el.value = v; }
  el.addEventListener("change", () => { store.set("ck-" + id, el.type === "checkbox" ? (el.checked ? "1" : "0") : el.value); renderPlan(); });
}
$("#cat").addEventListener("change", renderMeals);
$("#discK").addEventListener("change", renderDiscovery);
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("ck-lang", lang); applyLang(); }));

function showMsg(kind, key, arg){
  lastMsg = [kind, key, arg];
  const v = L[key];
  $("#msg").className = kind === "err" || kind === "errf" ? "msg err" : "msg";
  $("#msg").textContent = kind === "err" ? L.e_fail + (L[arg] || arg) : (typeof v === "function" ? v(arg) : v);
}
function setAccount(a){
  acct = a; acctVer++;
  charIdx = null; pickChar();
  renderAll();
}
function load(text, key, arg){
  try { const a = parseSave(text); setAccount(a); showMsg("ok", key || "ok_n", arg); return true; }
  catch (e) { showMsg("err", null, e.message === "nokey" ? "e_nokey" : e.message); return false; }
}
const isNick = s => /^[A-Za-z0-9_\-]{2,30}$/.test(s.trim());
async function loadNick(name){
  name = name.trim();
  if (!isNick(name)) return;
  $("#nick").value = name;
  const btn = $("#nickBtn"); btn.disabled = true;
  showMsg("ok", "nick_loading", name);
  try {
    const r = await fetch(`https://cdn.idleonefficiency.com/profiles/${encodeURIComponent(name.toLowerCase())}.json?t=${Date.now()}`, { cache: "no-store" });  // the CDN keeps profiles up to 30 min; the query skips stale copies
    if (!r.ok) { showMsg("errf", "e_nick", { name, status: r.status }); return; }
    const lm = Date.parse(r.headers.get("last-modified") || ""), when = isNaN(lm) ? "" : new Date(lm).toLocaleString(loc(), { dateStyle: "short", timeStyle: "short" });
    if (load(await r.text(), "ok_nick", { name, when })) {
      store.set("ck-nick", name); store.set("ck-src", "nick"); store.del("ck-save");
      try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch(e){}
    }
  } catch (e) { showMsg("errf", "e_nickfail", { name, err: e.message }); }
  finally { btn.disabled = false; }
}
$("#nickForm").addEventListener("submit", e => { e.preventDefault(); loadNick($("#nick").value); });
$("#go").addEventListener("click", () => {
  const t = $("#save").value;
  if (isNick(t)) { loadNick(t); return; }
  if (load(t)) { store.set("ck-save", t); store.set("ck-src", "raw"); $("#save").value = ""; try { history.replaceState(null, "", location.pathname); } catch(e){} }
});
$("#save").addEventListener("paste", () => setTimeout(() => $("#go").click(), 0));
$("#file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { $("#save").value = t; $("#go").click(); }); e.target.value = ""; });
$("#forget").addEventListener("click", () => {
  for (const k of ["ck-save","ck-src","ck-nick"]) store.del(k);
  $("#nick").value = ""; try { history.replaceState(null, "", location.pathname); } catch(e){}
  setAccount(null); showMsg("ok", "forgot");
});

setAccount(null);
applyLang();
const hashNick = decodeURIComponent(location.hash.slice(1)), savedNick = store.get("ck-nick");
if (isNick(hashNick)) loadNick(hashNick);
else if (store.get("ck-src") === "nick" && savedNick) loadNick(savedNick);
else { const s = store.get("ck-save"); if (s) load(s, "ok_saved"); }
</script>
